[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-graph-agents"
version = "0.2.0"
description = "Zero-dependency Python graph runtime for agent loops with Mermaid export"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Cobus Greyling" }]
keywords = [
    "agents",
    "graph",
    "workflow",
    "mermaid",
    "langgraph",
    "zero-dependency",
    "orchestration",
    "multi-agent",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]
graphviz = ["graphviz>=0.20"]

[project.urls]
Homepage = "https://github.com/cobusgreyling/graph-engineering"
Repository = "https://github.com/cobusgreyling/graph-engineering"
Issues = "https://github.com/cobusgreyling/graph-engineering/issues"
Documentation = "https://github.com/cobusgreyling/graph-engineering#readme"
Changelog = "https://github.com/cobusgreyling/graph-engineering/blob/main/CHANGELOG.md"
Demo = "https://cobusgreyling.github.io/graph-engineering/"
PyPI = "https://pypi.org/project/simple-graph-agents/"

[tool.setuptools.packages.find]
include = ["simple_graph_agents*"]

[tool.setuptools.package-data]
simple_graph_agents = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
