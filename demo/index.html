<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>simple-graph-agents · Mermaid demo</title>
  <script type="module">
    import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs";
    mermaid.initialize({
      startOnLoad: false,
      theme: "dark",
      flowchart: { curve: "basis", htmlLabels: true },
    });

    const DEFAULT = `flowchart TD
    start((start)) --> research
    research["research"]
    write["write"]
    verify["verify"]
    END((END))
    research --> write
    write --> verify
    verify -->|pass| END
    verify -->|retry| write
`;

    async function render(source) {
      const host = document.getElementById("diagram");
      host.innerHTML = "";
      const id = "mmd-" + Date.now();
      try {
        const { svg } = await mermaid.render(id, source.trim());
        host.innerHTML = svg;
        document.getElementById("status").textContent = "Rendered";
        document.getElementById("status").className = "ok";
      } catch (err) {
        host.innerHTML = `<pre class="err">${escapeHtml(String(err))}</pre>`;
        document.getElementById("status").textContent = "Parse error";
        document.getElementById("status").className = "bad";
      }
    }

    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    const ta = document.getElementById("source");
    const params = new URLSearchParams(location.search);
    ta.value = params.get("m") || DEFAULT;

    document.getElementById("render-btn").addEventListener("click", () => render(ta.value));
    document.getElementById("reset-btn").addEventListener("click", () => {
      ta.value = DEFAULT;
      render(DEFAULT);
    });
    document.getElementById("copy-btn").addEventListener("click", async () => {
      await navigator.clipboard.writeText(ta.value);
      document.getElementById("status").textContent = "Copied Mermaid source";
    });

    // Try to load graph.mmd generated by the example (works via local server)
    fetch("./graph.mmd")
      .then((r) => (r.ok ? r.text() : Promise.reject()))
      .then((text) => {
        if (text.trim()) {
          ta.value = text;
          return render(text);
        }
      })
      .catch(() => render(ta.value));
  </script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --ok: #3fb950;
      --bad: #f85149;
      font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 10% -10%, #1f2937 0%, var(--bg) 55%);
      color: var(--text);
    }
    header {
      padding: 1.25rem 1.5rem 0.5rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    main {
      display: grid;
      grid-template-columns: minmax(280px, 1fr) minmax(320px, 1.2fr);
      gap: 1rem;
      padding: 1rem 1.5rem 2rem;
    }
    @media (max-width: 800px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 420px;
    }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      padding: 0.65rem 0.85rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    .actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    button {
      background: #21262d;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.7rem;
      font-size: 0.8rem;
      cursor: pointer;
    }
    button:hover { border-color: var(--accent); color: #fff; }
    button.primary {
      background: #1f6feb;
      border-color: #1f6feb;
    }
    textarea {
      flex: 1;
      width: 100%;
      border: 0;
      resize: vertical;
      min-height: 360px;
      padding: 0.9rem 1rem;
      background: transparent;
      color: var(--text);
      font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      outline: none;
    }
    #diagram {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      overflow: auto;
    }
    #diagram svg { max-width: 100%; height: auto; }
    #status.ok { color: var(--ok); }
    #status.bad { color: var(--bad); }
    .err {
      color: var(--bad);
      white-space: pre-wrap;
      font-size: 0.85rem;
    }
    footer {
      padding: 0 1.5rem 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }
    code {
      background: #21262d;
      padding: 0.1rem 0.35rem;
      border-radius: 4px;
      font-size: 0.85em;
    }
  </style>
</head>
<body>
  <header>
    <h1>simple-graph-agents</h1>
    <p>Paste Mermaid from <code>Graph.render_mermaid()</code> — live preview, zero backend.</p>
  </header>
  <main>
    <section class="panel">
      <div class="panel-head">
        <span>Mermaid source</span>
        <div class="actions">
          <button type="button" id="reset-btn">Reset</button>
          <button type="button" id="copy-btn">Copy</button>
          <button type="button" class="primary" id="render-btn">Render</button>
        </div>
      </div>
      <textarea id="source" spellcheck="false" aria-label="Mermaid source"></textarea>
    </section>
    <section class="panel">
      <div class="panel-head">
        <span>Preview</span>
        <span id="status">…</span>
      </div>
      <div id="diagram" aria-live="polite"></div>
    </section>
  </main>
  <footer>
    Run <code>python examples/research_write_verify.py</code> to regenerate
    <code>demo/graph.mmd</code>, then serve this folder:
    <code>python -m http.server 8765 --directory demo</code>
  </footer>
</body>
</html>
